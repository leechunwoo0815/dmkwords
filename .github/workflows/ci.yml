name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# DmkWords 门禁（D3 重写）：MySQL-only + uv + bash scripts/gate.sh（9 步；tsc=step 7 /
# 契约快照+前端类型=step 8。2026-09-20 修正：旧注释写"含 tsc step 8"与 gate.sh 不符）
# 事实依据：项目为 pyproject.toml + uv（无 requirements.txt）；测试用 TRUNCATE/
# MySQL 语义，sqlite 无法启动；旧 job（verify_api_contract/check_model_consistency/
# verify_action_wiring/gen_config_doc.py）为 librio 遗留工具，仓库中不存在。
# fix44 R2：CI 装了 admin-web 依赖 → gate[8] 的 `pnpm gen:api --check`（前端类型漂移）在 CI 同样生效。

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmkwords_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-test-key-short"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_NAME: "dmkwords_ci"
      MOCK_PAYMENT: "true"
      MOCK_SMS: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (uv)
        run: uv sync --frozen

      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: admin-web/pnpm-lock.yaml

      - name: Install admin-web dependencies (tsc step 8)
        run: pnpm --dir admin-web install --frozen-lockfile

      - name: Apply migrations (empty CI database)
        run: .venv/bin/alembic upgrade head

      - name: Run full gate
        run: bash scripts/gate.sh
